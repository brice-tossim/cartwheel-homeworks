<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartwheel trace review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand">Cartwheel trace review</span>
    <nav class="tabs" aria-label="Views">
      <button type="button" class="tab is-active" aria-pressed="true">Read</button>
      <button type="button" class="tab" aria-disabled="true" title="Not built yet">Failure modes</button>
      <button type="button" class="tab" aria-disabled="true" title="Not built yet">Label</button>
      <button type="button" class="tab" aria-disabled="true" title="Not built yet">Progress</button>
    </nav>
    <span id="source" class="source" hidden></span>
    <span class="spacer"></span>
    <div class="progress">
      <span id="progress-text">Loading…</span>
      <div class="meter" aria-hidden="true"><div id="progress-bar" class="meter-fill"></div></div>
    </div>
    <button type="button" id="reload" class="button">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.5"></path><path d="M13 2.5v3h-3"></path></svg>
      Reload traces
    </button>
  </header>

  <div id="fallback" class="fallback" role="status" hidden></div>

  <div class="body">
    <nav id="list-panel" class="list-panel" aria-label="Conversations" tabindex="0">
      <div class="panel-head">
        <h2>Conversations</h2>
        <button type="button" id="hide-list" class="icon-button" aria-label="Hide the conversation list">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="14" height="12" rx="2"></rect><path d="M7 3v12"></path><path d="M12.5 7l-2 2 2 2"></path></svg>
        </button>
      </div>
      <div class="field">
        <label for="batch" class="label">Batch</label>
        <select id="batch" class="input"></select>
      </div>
      <div class="field">
        <label for="search" class="label">Find a conversation</label>
        <input id="search" type="search" class="input" placeholder="Words in a message, tool or reply" autocomplete="off">
      </div>
      <div class="field-grid">
        <div class="field">
          <label for="role" class="label">Who asks</label>
          <select id="role" class="input"></select>
        </div>
        <div class="field">
          <label for="action" class="label">Agent action</label>
          <select id="action" class="input"></select>
        </div>
        <div class="field">
          <label for="tool" class="label">Tool used</label>
          <select id="tool" class="input"></select>
        </div>
      </div>
      <div class="pills">
        <button type="button" id="two-turns" class="pill" aria-pressed="false"></button>
        <button type="button" id="unread" class="pill" aria-pressed="false">Not read yet</button>
      </div>
      <div class="list-count">
        <span id="list-count"></span>
        <span id="trace-count" class="muted"></span>
      </div>
      <div id="list" class="list"></div>
      <p class="keys">Keyboard: <kbd>←</kbd> <kbd>→</kbd> conversations · <kbd>N</kbd> note · <kbd>F</kbd> no failure · <kbd>[</kbd> hide or show this list</p>
    </nav>

    <nav id="list-rail" class="list-rail" aria-label="Conversations" hidden>
      <button type="button" id="show-list" class="icon-button" aria-label="Show the conversation list">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="14" height="12" rx="2"></rect><path d="M7 3v12"></path><path d="M10.5 7l2 2-2 2"></path></svg>
      </button>
      <span id="rail-label" class="rail-label">Conversations</span>
    </nav>

    <main id="conversation" class="conversation" tabindex="0">
      <p class="empty">Loading the conversations…</p>
    </main>

    <aside id="side" class="side" aria-label="Notes" tabindex="0"></aside>
  </div>
</div>

<div id="note-popover" class="popover" role="dialog" aria-label="Note about the selected text" hidden>
  <p class="popover-quote" id="popover-quote"></p>
  <label for="popover-text" class="label">Your note</label>
  <textarea id="popover-text" class="input" rows="3"></textarea>
  <div class="row">
    <button type="button" id="popover-save" class="button primary">Save note</button>
    <button type="button" id="popover-cancel" class="button">Cancel</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="/ui/app.js"></script>
</body>
</html>
